<title>Acompanhamento J&amp;T</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0f1115;color:#e7ebf0;font-family:'Segoe UI',system-ui,sans-serif}
  .card{width:340px;max-width:88vw;background:#161a21;border:1px solid #242a34;
        border-radius:14px;padding:28px 26px;text-align:center}

        border-radius:6px;font-size:14px;letter-spacing:.02em}

  input{width:100%;box-sizing:border-box;background:#0f1115;border:1px solid #2f3746;
        border-radius:8px;color:#e7ebf0;padding:11px 12px;font-size:14px;outline:none}
  input:focus{border-color:#e8002d}
  button{width:100%;margin-top:12px;background:#e8002d;color:#fff;border:0;border-radius:8px;
         padding:11px;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .erro{color:#ff6472;font-size:13px;margin-top:12px;min-height:16px}
</style>
</head>

const $=s=>document.querySelector(s);
async function abrir(){
  const senha=$("#senha").value;
  const erro=$("#erro"), btn=$("#btn");
  erro.textContent=""; btn.disabled=true; btn.textContent="Abrindo…";
  try{
    const raw=Uint8Array.from(atob(BLOB), c=>c.charCodeAt(0));
    const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveKey"]);
    const key=await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
    const html=new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(e){
    erro.textContent="Senha incorreta.";
    btn.disabled=false; btn.textContent="Abrir painel";
  }
}
$("#btn").addEventListener("click", abrir);
$("#senha").addEventListener("keydown", e=>{ if(e.key==="Enter") abrir(); });
</script>
