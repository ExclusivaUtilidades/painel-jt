const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const days=DATA.dias; let cur=days.length-1;try{const t=new Date().toLocaleDateString('pt-BR');const i=days.findIndex(d=>d.data===t);if(i>=0)cur=i;}catch(e){}
const ORD=["Jorge","Luiz","Eduardo"];
function totL(lojas){let t={p:0,c:0,v:0,cm:0,r:0};lojas.forEach(l=>{t.p+=l.pedidos;t.c+=l.custo;t.v+=l.venda;t.cm+=l.comissao;t.r+=l.receber;});return t;}
function dayTot(d){let t={p:0,c:0,v:0,cm:0,r:0};for(const pn in d.parceiros){const x=totL(d.parceiros[pn].lojas);for(const k in t)t[k]+=x[k];}return t;}
function renderTabs(){const start=Math.max(0,days.length-25);let h='';for(let i=days.length-1;i>=start;i--){h+=`<div class="tab ${i===cur?'active':''}" onclick="sel(${i})">${days[i].data.slice(0,5)}</div>`;}document.getElementById('tabs').innerHTML=h;}
function tbl(lojas){
  const ml=lojas.filter(l=>l.mkt.indexOf('Mercado')>=0), sh=lojas.filter(l=>l.mkt.indexOf('Mercado')<0);
  function block(arr,titulo){if(!arr.length)return'';let rows=arr.map(l=>`<tr><td class="l">${l.loja.replace('Mercado Livre - ','').replace('Shopee - ','')}</td><td>${l.pedidos}</td><td>${brl(l.custo)}</td><td>${brl(l.venda)}</td><td>${brl(l.comissao)}</td></tr>`).join('');const t=totL(arr);rows+=`<tr class="tot"><td class="l">Subtotal</td><td>${t.p}</td><td>${brl(t.c)}</td><td>${brl(t.v)}</td><td>${brl(t.cm)}</td></tr>`;return `<div class="mkt">${titulo}</div><table><thead><tr><th class="l">Loja</th><th>Ped</th><th>Custo</th><th>Venda</th><th>Com.10%</th></tr></thead><tbody>${rows}</tbody></table>`;}
  return block(sh,"Shopee")+block(ml,"Mercado Livre");
}
function sel(i){cur=i;render();window.scrollTo(0,0);}
function render(){
  renderTabs();
  const d=days[cur];
  document.getElementById('dayttl').innerHTML=`Envio de ${d.data} <span>· ${d.dow}</span>`;
  const t=dayTot(d);
  document.getElementById('kpis').innerHTML=`
   <div class="kpi"><div class="lbl">Pedidos (total)</div><div class="val">${t.p}</div></div>
   <div class="kpi"><div class="lbl">Estoque consumido</div><div class="val">${brl(t.c)}</div></div>
   <div class="kpi"><div class="lbl">Valor vendido</div><div class="val">${brl(t.v)}</div></div>
   <div class="kpi hl"><div class="lbl">Comissão a receber (10%)</div><div class="val">${brl(t.cm)}</div></div>`;
  let h='';
  for(const pn of ORD){
    const p=d.parceiros[pn];
    const lojas=p?p.lojas:[];
    const t=totL(lojas);
    const note=DATA.notas[pn]?`<div class="note">⚠ ${DATA.notas[pn]}</div>`:'';
    h+=`<div class="pcard p-${pn}"><div class="phead"><div class="nm">${pn}</div><div class="rc">${t.p} pedidos<br>a receber ${brl(t.r)}</div></div>
      <div class="pbody">
        <div class="psum"><span>Estoque <b>${brl(t.c)}</b></span><span>Vendido <b>${brl(t.v)}</b></span><span>Comissão <b>${brl(t.cm)}</b></span></div>
        ${note}
        ${lojas.length?tbl(lojas):'<div class="empty">Sem pedidos neste dia.</div>'}
      </div></div>`;
  }
  document.getElementById('cols').innerHTML=h;
}
try{document.getElementById("ger").textContent=DATA.gerado||"";}catch(e){}
