   <div class="kpi"><div class="lbl">Valor vendido</div><div class="val">${brl(t.v)}</div></div>
   <div class="kpi hl"><div class="lbl">Comissão a receber (10%)</div><div class="val">${brl(t.cm)}</div></div>`;
  let h='';
  for(const pn of ORD){
    const p=d.parceiros[pn];
    const lojas=p?p.lojas:[];
    const t=totL(lojas);
    const note=DATA.notas[pn]?`<div class="note">⚠ ${DATA.notas[pn]}</div>`:'';
    h+=`<div class="pcard p-${pn}"><div class="phead"><div class="nm">${pn}</div><div class="rc">${t.p} pedidos<br>a receber ${brl(t.r)}</div></div>
      <div class="pbody">
        <div class="psum"><span>Estoque <b>${brl(t.c)}</b></span><span>Vendido <b>${brl(t.v)}</b></span><span>Comissão <b>${brl(t.cm)}</b></span></div>
        ${note}
        ${lojas.length?tbl(lojas):'<div class="empty">Sem pedidos neste dia.</div>'}
      </div></div>`;
  }
  document.getElementById('cols').innerHTML=h;
}
try{document.getElementById("ger").textContent=DATA.gerado||"";}catch(e){}
render();
</script></body></html>
